<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админка — Кристальная шахта</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--tx:#1d1b2e;--m:#6b6880;--ac:#6c4cf5;--bd:#e2ddd3}
@media(prefers-color-scheme:dark){:root{--bg:#14121f;--card:#1e1b30;--tx:#ecebf5;--m:#9895b0;--ac:#9a82ff;--bd:#2f2b48}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px}
.w{max-width:960px;margin:0 auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:10px}
h1{font-size:20px;margin:0}.m{color:var(--m);font-size:13px}.r{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
label{font-size:12px;color:var(--m);display:block}input{background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font:inherit;width:140px}input.s{width:78px}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}button.g{background:var(--bd);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}header input{flex:1;min-width:160px;width:auto}
#login{max-width:380px;margin:40px auto}#login input{width:100%;margin:6px 0}
</style></head><body><div class="w">
<div id="login" class="card"><h1>🛠 Админка</h1><p class="m">Войди аккаунтом администратора.</p>
<input id="e" placeholder="Email" autocomplete="email"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password">
<div class="m" id="msg" style="min-height:20px"></div><button id="go">Войти</button></div>
<div id="app" style="display:none"><header><h1>🛠 Игроки</h1><input id="q" placeholder="🔍 Поиск по нику"><button id="rf" class="g">Обновить</button><button id="out" class="g">Выйти</button></header>
<div class="m" style="margin-bottom:10px">Измени поля и нажми «Применить». Игрок получит правку, когда игра у него открыта, или при следующем входе.</div><div id="list"></div><h2 style="margin:22px 0 8px;font-size:17px">🧾 Журнал проверки</h2><div id="log"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://sxqemqfulexnciinxdwg.supabase.co","sb_publishable_pekj1WhQKwymHdAPppGtmw_CUPQH49W"),$=id=>document.getElementById(id);
const N=["⛏️ Дрон-бур","🤖 Шахтёр-бот","🚜 Экскаватор","🏭 Фабрика","🛰️ Орбитальный лазер","🌀 Портал в жилу","⭐ Звёздная кузня","🌌 Квантовая шахта","🕳️ Чёрная дыра","👑 Кристальный разум"];
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
function fmt(n){if(n<1e3)return Math.floor(n)+"";const e=Math.floor(Math.log10(n));if(e>=18)return(n/10**e).toFixed(2)+"e"+e;const s=["","K","M","B","T","Qa"],i=Math.floor(e/3);return(n/10**(3*i)).toFixed(2)+s[i]}
let PL=[];
async function enter(){const {data:{user}}=await sb.auth.getUser();if(!user)return;
const r=await sb.from("admins").select("id").eq("id",user.id).maybeSingle();
if(!r.data){$("msg").textContent="Этот аккаунт не администратор.";await sb.auth.signOut();return}
$("login").style.display="none";$("app").style.display="block";load()}
async function load(){const r=await sb.from("players").select("id,nick,state,updated_at").order("updated_at",{ascending:false});
if(r.error){$("list").innerHTML='<p class="m">Ошибка: '+esc(r.error.message)+'</p>';return}PL=r.data||[];rend();loadLog()}
async function loadLog(){const r=await sb.from("cheat_log").select("nick,reason,details,created_at").order("created_at",{ascending:false}).limit(50);
$("log").innerHTML=(r.data||[]).map(x=>`<div class="card"><b>${esc(x.nick||"?")}</b> <span class="m">${new Date(x.created_at).toLocaleString("ru")}</span><br>${esc(x.reason)} <span class="m">${esc(JSON.stringify(x.details))}</span></div>`).join("")||'<p class="m">Журнал пуст: подозрительных сохранений не было.</p>'}
function rend(){const q=$("q").value.trim().toLowerCase();
$("list").innerHTML=PL.filter(p=>!q||String(p.nick).toLowerCase().includes(q)).map(p=>{const s=p.state||{},g=s.g||[];
return `<div class="card" data-p="${esc(p.id)}"><b>${esc(p.nick)}</b> <span class="m">ур. ${s.lvl||1} · кристаллов ${fmt(+s.c||0)} · осколков ${+s.sh||0} · обновлено ${new Date(p.updated_at).toLocaleString("ru")}</span>
<div class="r">${[["c","Кристаллы",s.c],["sh","Осколки",s.sh],["lvl","Уровень",s.lvl]].map(x=>`<label>${x[1]}<input type="number" step="any" data-f="${x[0]}" value="${Math.floor(+x[2]||0)}"></label>`).join("")}</div>
<div class="r">${N.map((n,i)=>`<label title="${n}">${n.split(" ")[0]}<input class="s" type="number" data-gi="${i}" value="${+g[i]||0}"></label>`).join("")}</div>
<div class="r"><button data-a="1">Применить</button></div></div>`}).join("")||'<p class="m">Игроков пока нет.</p>'}
$("list").onclick=async e=>{const b=e.target.closest("[data-a]");if(!b)return;const c=b.closest("[data-p]"),patch={};let ch=0;
c.querySelectorAll("[data-f]").forEach(i=>{if(i.value!==""&&i.value!==i.defaultValue){patch[i.dataset.f]=+i.value;ch=1}});
const gs=[];c.querySelectorAll("[data-gi]").forEach(i=>{if(i.value!==""&&i.value!==i.defaultValue){gs[+i.dataset.gi]=Math.max(0,Math.floor(+i.value)||0);ch=1}else gs[+i.dataset.gi]=""});
patch.g=gs.join(",");if(!ch){alert("Ничего не изменено");return}
const r=await sb.rpc("admin_set",{p_id:c.dataset.p,p_patch:patch});
if(r.error){alert("Ошибка: "+r.error.message);return}
alert("✅ Применено. Игрок получит изменения в течение ~20 секунд.");load()};
$("go").onclick=async()=>{$("msg").textContent="";const r=await sb.auth.signInWithPassword({email:$("e").value.trim(),password:$("p").value});
if(r.error){$("msg").textContent=r.error.message;return}enter()};
$("rf").onclick=load;$("q").oninput=rend;
$("out").onclick=async()=>{await sb.auth.signOut();location.reload()};
setInterval(()=>{const a=document.activeElement;if($("app").style.display!="none"&&(!a||a.tagName!="INPUT"))load()},30000);
enter();
</script></body></html>
